<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Edward Penna</title>
<!-- Content-Security-Policy, as a meta tag because GitHub Pages serves no
     headers and offers no way to add any.

     The point of it is connect-src. bake.js sanitises markup on the way into
     this file, so injected script should never arrive — but if it ever does,
     connect-src is what stops it posting the editor's GitHub token to somebody
     else's server. Defence in depth, not the primary defence.

     script-src carries one hash per inline block, INCLUDING the JSON-LD one:
     browsers apply script-src to every script element whatever its type, and an
     unhashed block is dropped silently, taking the structured data with it.
     publish.sh check 21 recomputes these on every build, because a stale hash
     blanks the page's scripts with no error anyone would notice.

     style-src keeps 'unsafe-inline' deliberately — the badge tints are inline
     style attributes and the resume carries its stylesheet inline. Inline styles
     execute no script. frame-ancestors is header-only and cannot be set here at
     all, so admin.js refuses to run inside a frame instead. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'self' https://api.github.com">

<meta name="robots" content="noindex">

<!-- ⚠ THE ONE FILE THAT HARDCODES AN ABSOLUTE PATH ⚠
     A 404 served at /a/b/c resolves RELATIVE urls against /a/b/ — so
     `assets/img/favicon.ico` would itself 404. Absolute paths are correct here
     and wrong everywhere else in this project.

     This comment used to warn that "a CNAME moving the site to a domain root
     would break these paths". It did, and this is that change: the site lives
     at https://penna.lol/ now, so the prefix is / rather than /portfolio/.
     publish.sh check 15 fails the build if the old host reappears anywhere. -->
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<style>
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center; text-align: center;
    background: #05070a; color: #e8efe4;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .code { font-size: 60px; font-weight: 800; letter-spacing: .06em; color: #9bbc0f;
          text-shadow: 0 0 20px rgb(155 188 15 / .45); margin: 0; }
  h1 { margin: 10px 0 0; font-size: 19px; font-weight: 600; }
  p  { margin: 8px 0 0; color: #90a08c; }
  a  { display: inline-block; margin-top: 26px; padding: 11px 22px;
       background: #2ddcff; color: #062a33; font-weight: 700;
       text-decoration: none; border-radius: 999px; }
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>No channel here</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to the menu</a>
  </div>
</body>
</html>
